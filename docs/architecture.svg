<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="960" height="560" fill="#0b0f16"/>
  <text x="480" y="34" text-anchor="middle" fill="#e2e8f0" font-size="19" font-weight="700">Envoy — agent-to-agent consumer dispute negotiation</text>
  <rect x="330" y="46" width="300" height="4" rx="2" fill="url(#hdr)"/>

  <!-- owner -->
  <rect x="30" y="120" width="150" height="64" rx="12" fill="#111827" stroke="#334155"/>
  <text x="105" y="146" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Owner</text>
  <text x="105" y="165" text-anchor="middle" fill="#94a3b8" font-size="11">pastes a dispute</text>

  <!-- strategy graph -->
  <rect x="230" y="105" width="250" height="94" rx="12" fill="#0f1a2b" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="355" y="128" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="700">STRATEGY GRAPH (Strands)</text>
  <rect x="248" y="140" width="62" height="26" rx="6" fill="#1e293b"/><text x="279" y="157" text-anchor="middle" fill="#cbd5e1" font-size="11">intake</text>
  <line x1="312" y1="153" x2="330" y2="153" stroke="#475569" marker-end="url(#ar)"/>
  <rect x="332" y="140" width="72" height="26" rx="6" fill="#1e293b"/><text x="368" y="157" text-anchor="middle" fill="#cbd5e1" font-size="11">research</text>
  <line x1="406" y1="153" x2="424" y2="153" stroke="#475569" marker-end="url(#ar)"/>
  <rect x="426" y="140" width="38" height="26" rx="6" fill="#1e293b"/><text x="445" y="157" text-anchor="middle" fill="#cbd5e1" font-size="10">plan</text>
  <text x="355" y="188" text-anchor="middle" fill="#64748b" font-size="10">reserve · BATNA · tactics (private)</text>

  <!-- advocate -->
  <rect x="180" y="260" width="200" height="110" rx="12" fill="#0c1a24" stroke="#38bdf8" stroke-opacity="0.6"/>
  <text x="280" y="284" text-anchor="middle" fill="#7dd3fc" font-size="13" font-weight="700">Envoy — advocate agent</text>
  <text x="280" y="304" text-anchor="middle" fill="#94a3b8" font-size="11">gpt-oss-120b · session-persisted</text>
  <text x="280" y="322" text-anchor="middle" fill="#94a3b8" font-size="11">structured Moves · firm, evidence-led</text>
  <text x="280" y="348" text-anchor="middle" fill="#64748b" font-size="10">never reveals reserve / BATNA</text>

  <!-- provider -->
  <rect x="580" y="260" width="210" height="110" rx="12" fill="#1a1114" stroke="#fb7185" stroke-opacity="0.5"/>
  <text x="685" y="284" text-anchor="middle" fill="#fda4af" font-size="13" font-weight="700">Company agent (provider)</text>
  <text x="685" y="304" text-anchor="middle" fill="#94a3b8" font-size="11">gpt-oss-20b · policy-bound</text>
  <text x="685" y="322" text-anchor="middle" fill="#94a3b8" font-size="11">frontline → supervisor → director</text>
  <text x="685" y="348" text-anchor="middle" fill="#64748b" font-size="10">swappable via Strands A2AAgent</text>

  <!-- negotiation channel -->
  <line x1="382" y1="305" x2="578" y2="305" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <rect x="418" y="282" width="124" height="46" rx="8" fill="#111827" stroke="#334155"/>
  <text x="480" y="300" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Move protocol</text>
  <text x="480" y="316" text-anchor="middle" fill="#94a3b8" font-size="10">intent · offer · message</text>

  <!-- decision gate -->
  <rect x="380" y="420" width="200" height="86" rx="12" fill="#1a0f14" stroke="#fb7185" stroke-opacity="0.6"/>
  <text x="480" y="444" text-anchor="middle" fill="#fda4af" font-size="12" font-weight="700">DECISION CARD</text>
  <text x="480" y="463" text-anchor="middle" fill="#94a3b8" font-size="11">settlement approval / impasse</text>
  <text x="480" y="482" text-anchor="middle" fill="#94a3b8" font-size="11">the only human interruption</text>
  <line x1="280" y1="370" x2="428" y2="420" stroke="#64748b" marker-end="url(#ar)"/>
  <line x1="685" y1="370" x2="532" y2="420" stroke="#64748b" marker-end="url(#ar)"/>

  <!-- settlement -->
  <rect x="640" y="440" width="230" height="60" rx="12" fill="#0f1a12" stroke="#34d399" stroke-opacity="0.5"/>
  <text x="755" y="465" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700">Settlement → Savings ledger</text>
  <text x="755" y="484" text-anchor="middle" fill="#94a3b8" font-size="11">approved with one tap, evidence kept</text>
  <line x1="580" y1="470" x2="638" y2="470" stroke="#475569" marker-end="url(#ar)"/>

  <!-- links -->
  <line x1="105" y1="184" x2="230" y2="150" stroke="#475569" marker-end="url(#ar)"/>
  <line x1="430" y1="199" x2="330" y2="258" stroke="#475569" marker-end="url(#ar)"/>

  <text x="480" y="540" text-anchor="middle" fill="#475569" font-size="10">Built with Strands Agents SDK · Graph orchestration · structured output · session persistence · LiteLLM</text>
</svg>
